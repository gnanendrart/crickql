name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: crickql
          POSTGRES_PASSWORD: crickql
          POSTGRES_DB: crickql
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crickql"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_DB: crickql
      PG_USER: crickql
      PG_PASSWORD: crickql
      PG_READER_USER: crickql_reader
      PG_READER_PASSWORD: crickql_reader
      SEED_MODE: fixtures  # offline: 3 committed sample matches, no Cricsheet download
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements-api.txt pytest ruff boto3 "moto[s3]"
      - name: Lint
        run: ruff check .
      - name: Seed fixtures + dbt build (models and data tests)
        run: bash scripts/seed.sh
      - name: Tests (Claude calls are mocked, no API key needed)
        run: pytest -q
