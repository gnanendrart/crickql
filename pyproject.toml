[project]
name = "crickql"
version = "0.1.0"
description = "Ask cricket questions in plain English: Cricsheet pipeline, text-to-SQL and RAG over IPL data."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["airflow/logs", "dbt/target", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
